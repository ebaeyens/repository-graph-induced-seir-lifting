name: Numerical reproducibility

on:
  push:
  pull_request:

jobs:
  full-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned scientific dependencies and test runner
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Verify existing tests
        run: python -m pytest -q
      - name: Regenerate everything from an empty output tree
        run: python scripts/reproduce_all.py
      - name: Check the regenerated results, reported numbers and Python files
        run: make check
